name: Docker CI

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t employee-api:${GITHUB_SHA::7} .
        
      - name: Verify Docker image
        run: docker images employee-api      